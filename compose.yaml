# StockLine derrière une passerelle (exercice 5).
# Seule la passerelle est joignable, en HTTPS ; l'API n'a plus de port publié.
services:
  passerelle:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./passerelle/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./passerelle/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interne
    restart: unless-stopped

  api:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: sqlite:////data/stockline.db
      STOCKLINE_JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - jwt_secret
    volumes:
      - donnees:/data
    networks:
      - interne
    # Durcissement du conteneur
    read_only: true                     # système de fichiers en lecture seule...
    tmpfs:
      - /tmp                            # ...sauf /tmp, en mémoire
    cap_drop:
      - ALL                             # aucune capacité Linux
    security_opt:
      - "no-new-privileges:true"        # impossible de gagner des privilèges
    deploy:
      resources:
        limits:
          cpus: "0.50"                  # API4 côté infrastructure :
          memory: 256M                  # plafonds de processeur, de mémoire
          pids: 64                      # et de processus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante')"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  donnees:

networks:
  interne:
