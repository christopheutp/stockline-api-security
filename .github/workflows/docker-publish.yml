name: Tests et publication Docker

on:
  push:
    branches:
      - 05-passerelle
    tags:
      - 'v0.5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tester l'API
        run: python -m pytest -q
      - name: Construire l'image de production
        run: docker build --target production -t stockline-ci:local .

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/v0.5' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/05-passerelle')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: christopheutp
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: christopheutp/stockline-api:0.5
