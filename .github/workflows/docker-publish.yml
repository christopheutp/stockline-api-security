name: Tests et publication Docker

on:
  push:
    branches:
      - 01-authentification
    tags:
      - 'v0.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests de l'API
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    # Seul le tag Git v0.1 (ou le déclenchement manuel sur cette branche)
    # publie l'image Docker 0.0 : un push sur la branche lance seulement les tests.
    if: github.ref == 'refs/tags/v0.1' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/01-authentification')
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: christopheutp
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: christopheutp/stockline-api:0.1
