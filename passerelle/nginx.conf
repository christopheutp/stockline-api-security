# Passerelle de StockLine (exercice 5) : seul point d'entrée de l'API.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Journal d'accès : une ligne JSON par requête, sur la sortie standard
    log_format json escape=json '{"date":"$time_iso8601","ip":"$remote_addr","methode":"$request_method",'
                                '"chemin":"$uri","statut":"$status","octets":"$body_bytes_sent",'
                                '"duree_s":"$request_time","api_s":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server_tokens off;                  # pas de numéro de version dans les réponses

    # Quotas par adresse IP (API4) : 5 requêtes par seconde pour l'API,
    # 10 par minute pour la connexion. Au-delà : 429.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;
    limit_req_status 429;

    upstream stockline {
        server api:8000;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/stockline.crt;
        ssl_certificate_key /etc/nginx/certs/stockline.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 16k;       # corps de requête plafonné (API4) : au-delà, 413
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # En-têtes de sécurité ajoutés à toutes les réponses (API8)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # Seules les méthodes utilisées par StockLine passent (API8)
        if ($request_method !~ ^(GET|POST|DELETE)$) {
            return 405;
        }

        # La documentation interactive n'est pas publiée (API8, API9)
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        location = /auth/jeton {
            limit_req zone=connexion burst=5 nodelay;
            proxy_pass http://stockline;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://stockline;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
